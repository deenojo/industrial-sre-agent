# One-off: run Patchwarden (github.com/deenojo/Vulnerability-Remediation-Agent) against this repo.
# Scans the Python backend and Node frontend, dedupes across scanners, triages by reachability,
# and uploads a dashboard. Read-only: opens no PRs. Trigger from the Actions tab.
name: patchwarden-scan

on:
  workflow_dispatch:
  push:
    branches: [patchwarden-scan]

permissions:
  contents: read

jobs:
  patchwarden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Patchwarden
        run: pip install "git+https://github.com/deenojo/Vulnerability-Remediation-Agent@main"

      - name: Install scanners (pinned + sha256-verified)
        run: |
          fetch() {  # url  dest  sha256
            for i in 1 2 3; do
              curl -fsSL --retry 3 -o "$2" "$1" && echo "$3  $2" | sha256sum -c - && return 0
              echo "attempt $i failed for $1"; sleep 5
            done
            echo "could not fetch $1"; exit 1
          }
          fetch https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz \
            /tmp/trivy.tgz bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
          tar -xzf /tmp/trivy.tgz -C /usr/local/bin trivy
          fetch https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64 \
            /usr/local/bin/osv-scanner 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
          chmod +x /usr/local/bin/osv-scanner
          trivy --version && osv-scanner --version

      - name: Pin backend dependencies (so ranges resolve to real versions)
        run: |
          python -m pip install -r backend/requirements.txt
          mkdir -p reports
          pip freeze > reports/requirements.txt   # named so osv-scanner recognizes it

      - name: Run scanners
        run: |
          trivy fs --scanners vuln --format json --output reports/trivy-fs.json . || true
          osv-scanner --format json --output reports/osv.json \
            --lockfile reports/requirements.txt \
            --lockfile frontend/package-lock.json || true

      - name: Patchwarden ingest + triage + report
        run: |
          vra ingest --trivy-fs reports/trivy-fs.json --osv reports/osv.json --json-out reports/findings.json
          vra summary | tee reports/summary.txt
          vra triage --backend heuristic --code-root backend -v | tee reports/triage.txt
          vra report --out reports/dashboard/index.html
          echo "=== remediation plan (dry run, opens nothing) ==="
          curl -fsSL -o /tmp/policy.yaml https://raw.githubusercontent.com/deenojo/Vulnerability-Remediation-Agent/main/policy/policy.yaml
          vra remediate --mode plan --repo-root . --policy /tmp/policy.yaml | tee reports/remediate-plan.txt || true

      - name: Job summary
        if: always()
        run: |
          {
            echo '## Patchwarden scan — industrial-sre-agent'
            echo '```'
            cat reports/summary.txt 2>/dev/null || echo '(no summary)'
            echo '```'
            echo '_Full triaged findings + dashboard in the uploaded artifact._'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: patchwarden-reports
          path: reports/
